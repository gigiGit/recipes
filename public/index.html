<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ricette</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="screen-style.css" >
  <link rel="stylesheet" href="style.css" >
</head>

<body>
  <h1>Ricette di Nonna Gio'</h1>
  <div id="main-layout">
    <aside id="sidebar">
      <div id="filters">
        <div style="display:none"> <label for="author-select">Filtra per autore:</label>
          <select id="author-select">
            <option value="">Tutti gli autori</option>
          </select>
        </div>
        <label for="recipe-filter">Cerca ricetta:</label>
        <input id="recipe-filter" type="text" placeholder="Nome ricetta, ingredienti...">

        <div style="margin-top: 1em; display: flex; gap: 0.5em;">

          <button id="print-all" style="flex: 1; background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);">📚
            Stampa Libro</button>
        </div>
      </div>

      <div id="recipe-tree">
        <div id="tree-content"></div>
        <ul id="ricette-list">
        </ul>
      </div>
    </aside>
    <section id="content">
      <div id="app">
        <div id="form-container" style="display:none;"></div>
        <button onclick="showForm()">Aggiungi Ricetta</button>
        <div id="selected-recipe" style="display: none;">
          <li id="recipe-template" style="display: none;">
            <button class="edit-btn no-print">Modifica</button>
            <button class="delete-btn no-print">Elimina</button>
            <button class="print-btn no-print">🖨️ Stampa Ricetta</button>
            <b class="recipe-name"></b><br>
            <div id="grid-container">
              <div class="recipe-images logo" id="recipe-image-1">         </div>
              <div class="c2">
                <small class="recipe-meta"></small><br>
                Difficoltà: <span class="recipe-difficulty"></span> | Costo: <span class="recipe-cost"></span><br>
                Tempo prep: <span class="recipe-prep-time"></span> min | Tempo cottura: <span
                  class="recipe-cook-time"></span>
                min<br>
                Quantità: <span class="recipe-quantity"></span> porzioni<br>
                Metodo cottura: <span class="recipe-method"></span><br>
                Tipo piatto: <span class="recipe-type"></span><br>
                Vino preferibile: <span class="recipe-wines"></span><br>
              </div>
              <div class="c3" id="recipe-ingredients">Ingredienti:<ul class="ingredienti-list"></ul></div>
              <div class="c4" id="recipe-image-2" class="recipe-images"></div>

              <div class="c5" id="recipe-image-3" class="recipe-images"></div>
              <div class="recipe-instructions"></div>
            </div>
          </li>
          <div id="selected-recipe-content"></div>
        </div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>

</html>
